# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002):
#   - `push` and `pull_request` triggered on `main`; this repository's default
#     branch is `dev`, so the workflow had never run on a push to it.
#   - the test job ran the starter's placeholder echo, so a green check proved
#     only that the runner could print a sentence. It now installs the exact
#     dependency versions the source needs and runs a real smoke test
#     (tests/test_smoke.py) that imports the app factory and round-trips a
#     token.
#   - Python is pinned to 3.11: newer Flask/Werkzeug releases are pulled in by
#     an unpinned `pip install flask`, but current Flask requires
#     itsdangerous>=2.2, which removed the TimedJSONWebSignatureSerializer
#     class src/uniti/common/token.py imports, and Werkzeug's routing module
#     (still used by the pinned Flask 1.1.4) relies on `ast.Str`, which
#     Python 3.12 removed.
#   - the test step failed with `ModuleNotFoundError: No module named 'src'`:
#     there is no tests/__init__.py or pytest config, so pytest's rootdir
#     import mode adds only the `tests/` directory to sys.path, not the
#     repository root, and `tests/test_smoke.py` imports `src`. The step now
#     runs with the repository root on PYTHONPATH.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

      # Add your project's linters below this line.

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Build
        run: pip install "flask==1.1.4" "itsdangerous==1.1.0" "werkzeug==1.0.1" "jinja2==2.11.3" "markupsafe==1.1.1" "click==7.1.2" "flask-sqlalchemy==2.5.1" "sqlalchemy<2" mysql-connector-python pytest

      - name: Test
        run: pytest tests/test_smoke.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}
